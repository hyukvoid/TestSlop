<svg xmlns="http://www.w3.org/2000/svg" width="460" height="596" viewBox="0 0 460 596" role="img" aria-label="How TestSlop works: an agent changes code, tests pass, TestSlop creates an Evil Twin and runs the same tests, both pass, and the missing witness is shown.">
<rect x="0.5" y="0.5" width="459" height="595" fill="#0d1117" stroke="#30363d"/>
<rect x="40" y="40" width="380" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="230" y="68" fill="#e6edf3" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">Agent changes code</text>
<line x1="230" y1="100" x2="230" y2="120" stroke="#8b949e" stroke-width="2"/>
<polygon points="230,130 225,120 235,120" fill="#8b949e"/>
<rect x="40" y="132" width="380" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="230" y="160" fill="#3fb950" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">Tests pass</text>
<line x1="230" y1="192" x2="230" y2="212" stroke="#8b949e" stroke-width="2"/>
<polygon points="230,222 225,212 235,212" fill="#8b949e"/>
<rect x="40" y="224" width="380" height="56" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
<text x="230" y="252" fill="#ff7b72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">TestSlop creates an Evil Twin</text>
<line x1="230" y1="284" x2="230" y2="304" stroke="#8b949e" stroke-width="2"/>
<polygon points="230,314 225,304 235,304" fill="#8b949e"/>
<rect x="40" y="316" width="380" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="230" y="344" fill="#e6edf3" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">Runs the same tests</text>
<line x1="230" y1="376" x2="230" y2="396" stroke="#8b949e" stroke-width="2"/>
<polygon points="230,406 225,396 235,396" fill="#8b949e"/>
<rect x="40" y="408" width="380" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="230" y="436" fill="#3fb950" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">Both pass</text>
<line x1="230" y1="468" x2="230" y2="488" stroke="#8b949e" stroke-width="2"/>
<polygon points="230,498 225,488 235,488" fill="#8b949e"/>
<rect x="40" y="500" width="380" height="56" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="230" y="528" fill="#e3b341" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central">Shows the missing witness</text>
</svg>
